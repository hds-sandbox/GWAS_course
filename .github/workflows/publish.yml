on: 
  push:
    branches: main
    paths:
      - 'Webpage/**'
      - '.compiledNotebooks/**'
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install libcurl on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Notebooks folder content
        if: runner.os == 'Linux'
        run: |
          cp -r Notebooks/* Webpage/develop

      - name: Pull access pages
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/hds-sandbox/common-files_development.git /tmp/common-files
          git -C /tmp/common-files sparse-checkout set access_genomedk access_ucloud other_hpc
          cd /tmp/common-files
          APP=genomicsapp COURSE=Intro_to_GWAS
          sed -i.bak -e "s|__APP_NAME__|$APP|g" -e "s|__COURSE_NAME__|$COURSE|g" access_genomedk/genomedk.qmd other_hpc/otherHPC.qmd && rm access_genomedk/genomedk.qmd.bak other_hpc/otherHPC.qmd.bak
          APP="Genomics Sandbox" COURSE="Introduction to GWAS"
          sed -i.bak -e "s|__UCLOUD_APP_NAME__|$APP|g" -e "s|__COURSE_TITLE__|$COURSE|g" access_ucloud/UCloud.qmd && rm access_ucloud/UCloud.qmd.bak
          cp -r access_genomedk/genomedk.qmd other_hpc/otherHPC.qmd access_ucloud/UCloud.qmd access_ucloud/img_ucloud "$GITHUB_WORKSPACE/Webpage/access/"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: Webpage